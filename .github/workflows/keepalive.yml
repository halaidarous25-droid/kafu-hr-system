name: Supabase Keep-Alive

# نبضة تلقائية تمنع مشروع Supabase المجاني من الدخول في سبات

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 6 */2 * *'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase database
        run: |
          echo "إرسال نبضة إلى قاعدة بيانات KAFU..."
          HTTP_CODE=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            "https://omrlaafgvtdiqacljrpn.supabase.co/rest/v1/employees?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "رمز الاستجابة: $HTTP_CODE"
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✓ النبضة نجحت — قاعدة البيانات نشطة"
          else
            echo "✗ فشلت النبضة — الاستجابة: $HTTP_CODE"
            cat /tmp/resp.txt
            exit 1
          fi
